<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Tricouture</title>
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪡</text></svg>"
		/>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				font-family: system-ui, sans-serif;
				background: #faf7fb;
				color: #2b2330;
				padding: 1.5rem;
			}
			.card {
				background: #fff;
				border: 1px solid #e6dde9;
				border-radius: 12px;
				padding: 1.5rem;
				max-width: 380px;
				width: 100%;
				box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
			}
			h1 {
				color: #7c4d8b;
				margin: 0 0 0.5rem;
			}
			input,
			button {
				width: 100%;
				box-sizing: border-box;
				padding: 0.7rem;
				font-size: 1rem;
				border-radius: 8px;
				border: 1px solid #e6dde9;
				margin-top: 0.6rem;
			}
			button {
				background: #7c4d8b;
				color: #fff;
				border: none;
				cursor: pointer;
			}
			.muted {
				color: #7a7080;
				font-size: 0.9rem;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<h1>🪡 Tricouture</h1>
			<p class="muted" data-t="intro">
				Enter your Tricouture server address to connect (e.g.
				<code>https://tricouture.example.com</code>).
			</p>
			<input id="url" type="url" placeholder="https://…" inputmode="url" autocomplete="url" />
			<button id="go" data-t="go">Connect</button>
			<p class="muted" id="hint" style="margin-top: 1rem" data-t="hint">
				Tip: you can also lock the URL at build time via the GitHub Actions variable
				<code>SERVER_URL</code>.
			</p>
		</div>
		<script>
			// Fallback shell: remembers the URL and redirects the WebView to the server.
			const STRINGS = {
				en: {
					intro:
						'Enter your Tricouture server address to connect (e.g. <code>https://tricouture.example.com</code>).',
					go: 'Connect',
					hint:
						'Tip: you can also lock the URL at build time via the GitHub Actions variable <code>SERVER_URL</code>.',
					unreachable: 'The saved server is not responding. Check your connection or the address, then tap Connect.'
				},
				fr: {
					intro:
						"Entre l'adresse de ton serveur Tricouture pour t'y connecter (ex. <code>https://tricouture.mondomaine.fr</code>).",
					go: 'Se connecter',
					hint:
						'Astuce : tu peux aussi figer l\'URL au build via la variable GitHub Actions <code>SERVER_URL</code>.',
					unreachable: 'Le serveur enregistré ne répond pas. Vérifie ta connexion ou l\'adresse, puis appuie sur Se connecter.'
				}
			};
			const locale = navigator.language?.toLowerCase().startsWith('fr') ? 'fr' : 'en';
			document.documentElement.lang = locale;
			for (const el of document.querySelectorAll('[data-t]')) {
				el.innerHTML = STRINGS[locale][el.dataset.t];
			}
			document.getElementById('go').textContent = STRINGS[locale].go;

			const input = document.getElementById('url');
			const hint = document.getElementById('hint');

			// A saved server that doesn't answer (offline, address changed) shows
			// the form again instead of a dead page there is no way out of.
			async function reachable(url) {
				const ctrl = new AbortController();
				const timer = setTimeout(() => ctrl.abort(), 8000);
				try {
					await fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal });
					return true;
				} catch {
					return false;
				} finally {
					clearTimeout(timer);
				}
			}

			// What this shell can do for the site, announced in the hash of the
			// first page it opens (see app/src/lib/shell.ts). Bump SHELL_VERSION when
			// adding a capability, so the site only asks shells that know it.
			const SHELL_VERSION = 3;
			const LN = window.Capacitor?.Plugins?.LocalNotifications;
			// Material You (version 3): the wallpaper's main color, read by the
			// app's SystemColors plugin (mobile/native), "none" before Android 12.
			const SC = window.Capacitor?.Plugins?.SystemColors;
			const accent = (async () => {
				try {
					const r = SC ? await SC.get() : null;
					return /^#[0-9a-f]{6}$/i.test(r?.accent || '') ? r.accent : 'none';
				} catch {
					return 'none';
				}
			})();

			// replace(), not href: the shell must not stay in the history, or the
			// back button would land here and bounce straight back to the server.
			function goTo(url, hash) {
				location.replace(hash ? url.split('#')[0] + '#' + hash : url);
			}
			async function shellHash() {
				if (!LN) return '';
				return (
					'tc_shell=' + encodeURIComponent(location.origin) + '&tc_v=' + SHELL_VERSION +
					'&tc_accent=' + encodeURIComponent(await accent)
				);
			}
			function sameServer(url, saved) {
				try {
					return new URL(url).origin === new URL(saved).origin;
				} catch {
					return false;
				}
			}

			// A tapped notification carries the page to open (e.g. /avent).
			let tappedHref = null;
			LN?.addListener?.('localNotificationActionPerformed', (e) => {
				const href = e?.notification?.extra?.href;
				if (typeof href === 'string' && href.startsWith('/')) tappedHref = href;
			});

			// The site sends its notifications here to be scheduled on the phone:
			// #advent=<json {plan, ids, sig, back}>. Only this local page can reach
			// the phone's notification system, since no server address is built in.
			async function scheduleFromSite(raw, saved) {
				let msg;
				try {
					msg = JSON.parse(decodeURIComponent(raw));
				} catch {
					return false;
				}
				const back = typeof msg.back === 'string' && sameServer(msg.back, saved) ? msg.back : saved;
				let result = 'unavailable';
				if (LN) {
					try {
						const ids = (msg.ids || []).filter((x) => Number.isInteger(x));
						if (ids.length) await LN.cancel({ notifications: ids.map((id) => ({ id })) });
						const plan = (msg.plan || []).filter((n) => Number.isInteger(n.id) && n.at && new Date(n.at) > new Date());
						if (plan.length) {
							const perms = await LN.requestPermissions();
							if (perms.display === 'granted') {
								await LN.schedule({
									notifications: plan.map((n) => ({
										id: n.id,
										title: String(n.title || ''),
										body: String(n.body || ''),
										schedule: { at: new Date(n.at), allowWhileIdle: true },
										extra: { href: typeof n.href === 'string' ? n.href : '/' }
									}))
								});
								result = 'ok';
							} else result = 'denied';
						} else result = 'ok';
					} catch {
						result = 'error';
					}
				}
				goTo(back, 'tc_advent=' + encodeURIComponent(String(msg.sig || '')) + '&tc_result=' + result + '&' + (await shellHash()));
				return true;
			}

			const saved = localStorage.getItem('serverUrl');
			const advent = location.hash.startsWith('#advent=') ? location.hash.slice('#advent='.length) : null;
			if (saved && advent) {
				document.querySelector('.card').style.visibility = 'hidden';
				scheduleFromSite(advent, saved).then(async (handled) => {
					if (!handled) goTo(saved, await shellHash());
				});
			} else if (saved) {
				input.value = saved;
				reachable(saved).then(async (ok) => {
					if (!ok) {
						hint.innerHTML = STRINGS[locale].unreachable;
						return;
					}
					// Give a notification tap that launched the app time to arrive.
					await new Promise((r) => setTimeout(r, 300));
					goTo(tappedHref ? new URL(tappedHref, saved).href : saved, await shellHash());
				});
			}
			document.getElementById('go').addEventListener('click', async () => {
				let v = input.value.trim();
				if (!v) return;
				if (!/^https?:\/\//.test(v)) v = 'https://' + v;
				localStorage.setItem('serverUrl', v);
				goTo(v, await shellHash());
			});
		</script>
	</body>
</html>
