<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Tricouture</title>
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪡</text></svg>"
		/>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				font-family: system-ui, sans-serif;
				background: #faf7fb;
				color: #2b2330;
				padding: 1.5rem;
			}
			.card {
				background: #fff;
				border: 1px solid #e6dde9;
				border-radius: 12px;
				padding: 1.5rem;
				max-width: 380px;
				width: 100%;
				box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
			}
			h1 {
				color: #7c4d8b;
				margin: 0 0 0.5rem;
			}
			input,
			button {
				width: 100%;
				box-sizing: border-box;
				padding: 0.7rem;
				font-size: 1rem;
				border-radius: 8px;
				border: 1px solid #e6dde9;
				margin-top: 0.6rem;
			}
			button {
				background: #7c4d8b;
				color: #fff;
				border: none;
				cursor: pointer;
			}
			.muted {
				color: #7a7080;
				font-size: 0.9rem;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<h1>🪡 Tricouture</h1>
			<p class="muted" data-t="intro">
				Enter your Tricouture server address to connect (e.g.
				<code>https://tricouture.example.com</code>).
			</p>
			<input id="url" type="url" placeholder="https://…" inputmode="url" autocomplete="url" />
			<button id="go" data-t="go">Connect</button>
			<p class="muted" id="hint" style="margin-top: 1rem" data-t="hint">
				Tip: you can also lock the URL at build time via the GitHub Actions variable
				<code>SERVER_URL</code>.
			</p>
		</div>
		<script>
			// Fallback shell: remembers the URL and redirects the WebView to the server.
			const STRINGS = {
				en: {
					intro:
						'Enter your Tricouture server address to connect (e.g. <code>https://tricouture.example.com</code>).',
					go: 'Connect',
					hint:
						'Tip: you can also lock the URL at build time via the GitHub Actions variable <code>SERVER_URL</code>.'
				},
				fr: {
					intro:
						"Entre l'adresse de ton serveur Tricouture pour t'y connecter (ex. <code>https://tricouture.mondomaine.fr</code>).",
					go: 'Se connecter',
					hint:
						'Astuce : tu peux aussi figer l\'URL au build via la variable GitHub Actions <code>SERVER_URL</code>.'
				}
			};
			const locale = navigator.language?.toLowerCase().startsWith('fr') ? 'fr' : 'en';
			document.documentElement.lang = locale;
			for (const el of document.querySelectorAll('[data-t]')) {
				el.innerHTML = STRINGS[locale][el.dataset.t];
			}
			document.getElementById('go').textContent = STRINGS[locale].go;

			const saved = localStorage.getItem('serverUrl');
			if (saved) location.href = saved;
			document.getElementById('go').addEventListener('click', () => {
				let v = document.getElementById('url').value.trim();
				if (!v) return;
				if (!/^https?:\/\//.test(v)) v = 'https://' + v;
				localStorage.setItem('serverUrl', v);
				location.href = v;
			});
		</script>
	</body>
</html>
