services:
  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ORIGIN: ${ORIGIN}
      AUTH_SECRET: ${AUTH_SECRET}
      MEDIA_DIR: ${MEDIA_DIR:-/data/media}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      VISION_URL: ${VISION_URL:-}
      WHISPER_URL: ${WHISPER_URL:-}
      SD_URL: ${SD_URL:-}
      # Monthly model-watch cron job (scripts/model-watch/) — empty disables
      # the /api/cron/model-watch endpoint entirely (503).
      MODEL_WATCH_TOKEN: ${MODEL_WATCH_TOKEN:-}
      MODEL_WATCH_MAX_CANDIDATES: ${MODEL_WATCH_MAX_CANDIDATES:-3}
      MODEL_WATCH_MIN_IMPROVEMENT: ${MODEL_WATCH_MIN_IMPROVEMENT:-5.0}
      # adapter-node plafonne les corps de requête à 512 Ko par défaut : un seul
      # PDF de patron un peu lourd suffit à déclencher un 413, et un import en
      # lot le dépasse à coup sûr. 100 Mo par défaut, ajustable dans le .env.
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-104857600}
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - media:/data/media

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports exposed to the host: only accessible within the compose network.

volumes:
  pgdata:
  media:
