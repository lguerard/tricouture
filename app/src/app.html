<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#7c4d8b" />
		<script>
			// Saved theme applied before first paint (no light flash in dark mode).
			try {
				var theme = localStorage.getItem("theme");
				if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
				// Couleurs choisies (Material You ou couleur au choix), calculées
				// par lib/theme.svelte.ts lors de la visite précédente.
				var css = localStorage.getItem("themeCss");
				if (css) {
					var style = document.createElement("style");
					style.id = "theme-colors";
					style.textContent = css;
					document.head.appendChild(style);
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
