name: Release

# On every push to main: compute next version via git-cliff,
# build the Android APK, and publish a GitHub Release.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cliff.outputs.version }}
      released: ${{ steps.cliff.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Compute version and release notes
        id: cliff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(git cliff --config cliff.toml --bumped-version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # If no new conventional commits, skip the release.
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already tagged — skipping release."
            exit 0
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"

          git cliff --config cliff.toml --tag "$VERSION" -o CHANGELOG.md
          git cliff --config cliff.release.toml --unreleased --tag "$VERSION" --strip all -o RELEASE_NOTES.md
          echo "Next version: $VERSION"

      - name: Upload release notes
        if: steps.cliff.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: |
            CHANGELOG.md
            RELEASE_NOTES.md

  # The Android app (android/, Kotlin/Compose).
  android-native:
    needs: changelog
    if: needs.changelog.outputs.released == 'true'
    uses: ./.github/workflows/android-native.yml
    with:
      release: true
      version: ${{ needs.changelog.outputs.version }}
    secrets: inherit

  publish:
    needs: [changelog, android-native]
    if: ${{ !cancelled() && needs.changelog.outputs.released == 'true' && needs.android-native.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ needs.changelog.outputs.version }}
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      # Only the signed APK is published (the debug one stays a workflow
      # artifact). Its file name is kept: updaters may match on it.
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: tricouture-native-release
          path: apk-native

      - name: Name the native APK
        run: |
          if [ ! -f apk-native/app-release.apk ]; then
            echo "::error::No signed APK for this release (KEYSTORE_BASE64 secret missing?)."
            exit 1
          fi
          mv apk-native/app-release.apk apk-native/tricouture-native.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.changelog.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.changelog.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: apk-native/tricouture-native.apk
