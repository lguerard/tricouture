name: Android native

# Native app (android/, Kotlin/Compose), rewritten from the Capacitor shell.
# Built on every change for now; releases still ship the Capacitor APK until
# the native app covers every screen.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-native.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-native.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tricouture-native-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
