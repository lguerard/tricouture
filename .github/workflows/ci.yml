name: CI

# Typecheck and build the web app on every push and pull request.
on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npm run check

      - name: Unit tests
        working-directory: app
        run: npm test

      - name: Build
        working-directory: app
        run: npm run build
