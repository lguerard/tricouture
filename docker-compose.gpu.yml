# Override to enable the AI services on GPU (LLM + voice).
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Host prerequisite: NVIDIA driver + nvidia-container-toolkit.
#
# Two ways to get an LLM (see docs/SELF-HOSTING.md §6.2):
#   - bundled: enable the "local-ollama" profile (COMPOSE_PROFILES=local-ollama
#     in .env, or --profile local-ollama) to run this overlay's own Ollama;
#   - external: leave the profile off and point OLLAMA_URL at an Ollama that
#     already runs on the host/another stack. Recommended when the GPU already
#     hosts one: two Ollama instances on one card each keep their own model
#     copy in VRAM. Nothing here depends_on "ollama", so either mode works.
services:
  ollama:
    # Pinned (not :latest) so an image update never changes behaviour under
    # our feet. 0.40.10 = newest stable tag on Docker Hub when pinned, with
    # Gemma 4 support (text + image, structured outputs, `think`). To bump:
    # pick the newest non-rc tag from
    #   https://hub.docker.com/r/ollama/ollama/tags
    # update both images below, then `docker compose ... pull ollama`.
    image: ollama/ollama:0.40.10
    profiles: ["local-ollama"]
    restart: unless-stopped
    environment:
      # Same context length the app requests (OLLAMA_NUM_CTX): a mismatch
      # between callers makes Ollama reload the model.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_NUM_CTX:-8192}
      # Flash attention + 8-bit KV cache: roughly halves the KV cache VRAM
      # for a negligible quality cost.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      # Never keep two chat models resident on a 10 GB card. 2 (not 1) so
      # the small embedding model (~0.3 GB) can stay loaded next to the chat
      # model: with 1, every semantic search or save would evict the chat
      # model and the next AI request would reload ~8 GB.
      OLLAMA_MAX_LOADED_MODELS: "2"
      # Unload an idle model after 5 min to give the VRAM back to the other
      # GPU users (whisper, other stacks).
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # No port exposed: consumed by "app" via the compose network.

  # Downloads models on first start then exits (bundled Ollama only; with an
  # external Ollama, pull the models there yourself, see the docs).
  ollama-pull:
    image: ollama/ollama:0.40.10
    profiles: ["local-ollama"]
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - >
        sleep 6;
        ollama pull ${OLLAMA_CHAT_MODEL:-gemma4:12b} &&
        ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    restart: "no"

  # Whisper service (hands-free voice transcription) — phase 5.
  # Loads its model on the first request and unloads it after
  # WHISPER_IDLE_UNLOAD_SECONDS idle, so it only holds VRAM (~1-1.5 GB for
  # large-v3-turbo in int8_float16) while the voice counter is in use.
  # First request downloads the model (~1.6 GB) into the whisper-cache volume.
  whisper:
    build: ./services/whisper
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-}
      WHISPER_IDLE_UNLOAD_SECONDS: ${WHISPER_IDLE_UNLOAD_SECONDS:-300}
      # Return freed CUDA memory to the driver instead of CTranslate2's
      # caching allocator keeping it, so an unload really frees the VRAM.
      CT2_CUDA_ALLOCATOR: cuda_malloc_async
    volumes:
      - whisper-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  # Ollama's model store (name kept from earlier versions so existing
  # installs keep their downloaded models).
  models:
  whisper-cache:
